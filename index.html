<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviews</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/css/cred.css">
<style>html,body{margin:0;background:transparent}</style>
</head>
<body>
<!-- Demo host page. Defaults to the bundled fictional example/.
     Override with ?source=<data-repo-url>. Options: &layout=&platform=&limit=&summary=off&theme=light|dark|auto
     Constrained: &constrained=true
     Demo chrome only: ?theme=dark → #0d1117 page background; ?theme=light → #fff. Omitted/auto stays transparent.
     (embed.html stays transparent always — do not copy this chrome there.) -->
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    if (!location.search) document.addEventListener('DOMContentLoaded', function () { document.getElementById('intro').hidden = false; });
    if (!q.has('source')) {
      q.set('source', new URL('example/', location.href).href);
      history.replaceState(null, '', location.pathname + '?' + q + location.hash);
    }
    var theme = (q.get('theme') || '').toLowerCase();
    if (theme !== 'light' && theme !== 'dark') return;
    var dark = theme === 'dark';
    var bg = dark ? '#0d1117' : '#ffffff';
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    document.documentElement.style.background = bg;
    document.body.style.background = bg;
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<script src="assets/js/cred.js" defer data-overflow="visible"></script>
<div id="intro" hidden style="max-width:1100px;margin:28px auto;padding:0 20px;font:14px/1.5 system-ui,sans-serif;color:#555">
<p>Example data (fictional). Embed with your own data repo:</p>
<pre style="background:#f6f6f6;border:1px solid #e3e3e3;border-radius:8px;padding:12px;overflow-x:auto;font-size:13px"><code>&lt;script src="https://cred-d2r.pages.dev/assets/js/cred.js" data-source="https://your-reviews.pages.dev/" defer&gt;&lt;/script&gt;</code></pre>
<p>Setup and options: <a href="https://github.com/bristweb/reviews-widget" style="color:inherit">github.com/bristweb/reviews-widget</a></p>
</div>
</body>
</html>
