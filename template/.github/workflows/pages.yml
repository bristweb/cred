# Publish with GitHub Pages (same export as Cloudflare Pages).
# Settings → Pages → Source: GitHub Actions, then Actions → Deploy to GitHub Pages → Run workflow.
# GitHub Pages has no rewrites (_redirects is ignored): use real paths such as
# https://YOUR-USER.github.io/YOUR-REPO/ and https://YOUR-USER.github.io/YOUR-REPO/package/assets/js/cred.js.
name: Deploy to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for /v/ builds
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export the committed files and add the /v/ releases
        run: sh package/tools/export-site.sh _publish
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _publish
      - id: deployment
        uses: actions/deploy-pages@v4
