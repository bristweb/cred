<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviews</title>
<link rel="icon" href="data:,">
<style>
html{margin:0}
/* Standalone: follow system light/dark with a normal page background. */
html:not([data-embed]){color-scheme:light dark;background:Canvas;color:CanvasText}
html:not([data-embed]) body{margin:0;padding:24px 16px}
/* Iframe / ?embed: stay transparent and do not set color-scheme (a mismatched scheme paints an opaque iframe backdrop). */
html[data-embed],html[data-embed] body{margin:0;background:transparent}
</style>
<!-- One page for standalone and iframe. data-embed is set when window.self !== window.top, or when ?embed is present.
     ?theme=light|dark overrides the default auto theme. -->
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var embed = q.has('embed') || window.self !== window.top;
  if (embed) document.documentElement.setAttribute('data-embed', '');
  var t = q.get('theme');
  if (t === 'light' || t === 'dark') {
    document.documentElement.dataset.theme = t;
    if (!embed) document.documentElement.style.colorScheme = t;
  }
})();
</script>
</head>
<body>
<!-- Your reviews page. The widget reads data/ from this site; edit the files there, not this page. -->
<script src="package/assets/js/cred.js" defer></script>
</body>
</html>
