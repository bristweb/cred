<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviews</title>
<link rel="icon" href="data:,">
<style>
html{margin:0}
html:not([data-embed]){color-scheme:light dark;background:Canvas;color:CanvasText}
html:not([data-embed]) body{margin:0;padding:24px 16px}
html[data-embed],html[data-embed] body{margin:0;background:transparent}
</style>
<!-- Cred's public /embed.html. Same dual-mode page as the starter root: iframe or ?embed → transparent. -->
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var embed = q.has('embed') || window.self !== window.top;
  if (embed) document.documentElement.setAttribute('data-embed', '');
  var t = q.get('theme');
  if (t === 'light' || t === 'dark') {
    document.documentElement.dataset.theme = t;
    if (!embed) document.documentElement.style.colorScheme = t;
  }
})();
</script>
</head>
<body>
<script src="../template/package/assets/js/cred.js" defer></script>
</body>
</html>
