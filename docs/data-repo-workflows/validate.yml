# Checks config.json, reviews/<year>.json and assets/images/reviewers/ with the shared validator
# (https://github.com/bristweb/cred, scripts/validate.mjs).
# Sample for a standalone data repo: copy to .github/workflows/validate.yml at that repo's root.
name: Validate reviews data
on:
  push:
  workflow_dispatch:
permissions:
  contents: write # lets the check commit the updated rating badge (badge.json, badge.svg)
jobs:
  validate:
    uses: bristweb/cred/.github/workflows/validate.yml@main
