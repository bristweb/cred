# Optional: publish the built site with GitHub Pages instead of Cloudflare Pages.
# In the repo, Settings → Pages → Source: GitHub Actions, then run this workflow (Actions tab → Run workflow).
name: Deploy to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for /v/ builds
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: |
          node src/scripts/build.mjs dist
          node src/scripts/build-versions.mjs dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
