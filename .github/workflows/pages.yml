# Optional: publish the site with GitHub Pages instead of Cloudflare Pages.
# In the repo, Settings → Pages → Source: GitHub Actions, then run this workflow (Actions tab → Run workflow).
# GitHub Pages has no rewrites (_redirects is ignored): use the real paths, e.g. https://<user>.github.io/<repo>/site/
# and https://<user>.github.io/<repo>/package/assets/js/cred.js. The bare /<repo>/ shows 404.html (no root page; Cloudflare serves site/ at / instead).
name: Deploy to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for /v/ builds
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export the committed files and add the /v/ releases
        run: sh package/tools/export-site.sh _publish
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _publish
      - id: deployment
        uses: actions/deploy-pages@v4
