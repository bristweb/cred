# Reusable check for a reviews data repo. A data repo calls it with:
#   permissions:
#     contents: write
#   jobs:
#     validate:
#       uses: bristweb/cred/.github/workflows/validate.yml@main
# After validating, it rewrites badge.json / badge.svg (rating badge) and commits them to the default branch when they change.
name: Validate reviews data
on:
  workflow_call:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: data
      - uses: actions/checkout@v4
        with:
          repository: bristweb/cred
          ref: main
          path: widget
      - run: npm ci
        working-directory: widget
      - run: node widget/package/tools/validate.mjs data
      - run: node widget/package/tools/badge.mjs data
      - name: Commit badge files
        if: github.ref_name == github.event.repository.default_branch
        working-directory: data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add badge.json badge.svg
          git diff --cached --quiet && exit 0
          name=$(gh api "users/$GITHUB_ACTOR" --jq '.name // empty' 2>/dev/null || true)
          git config user.name "${name:-$GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git commit -m "Update rating badge"
          git push
