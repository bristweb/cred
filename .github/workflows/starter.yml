# Publishes the starter repository (bristweb/cred-starter, a GitHub template) from this repo on every push to main:
# a verbatim copy of template/ (no assembly). The starter is generated output: edit template/ here, never the starter.
# Needs the repo secret STARTER_DEPLOY_KEY: the private half of a write deploy key on bristweb/cred-starter only.
name: Publish starter
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cred-starter
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'bristweb/cred'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish template/ verbatim as the starter
        run: sh template/package/tools/build-starter.sh "$RUNNER_TEMP/starter"
      - name: Commit the generated files to the starter if they changed
        env:
          STARTER_DEPLOY_KEY: ${{ secrets.STARTER_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STARTER_DEPLOY_KEY" > ~/.ssh/starter && chmod 600 ~/.ssh/starter
          # GitHub's published SSH host keys, not trust-on-first-use.
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/starter -o IdentitiesOnly=yes"
          # Plain clone (not actions/checkout) so the very first publish into the empty repository works too.
          git clone -q git@github.com:bristweb/cred-starter.git "$RUNNER_TEMP/starter-repo"
          cd "$RUNNER_TEMP/starter-repo"
          git checkout -q -B main
          git rm -rq --ignore-unmatch . >/dev/null
          cp -a "$RUNNER_TEMP/starter/." .
          git add -A
          if git diff --cached --quiet; then echo "Starter already up to date."; exit 0; fi
          git -c user.name=Cred -c user.email=cred@localhost commit -qm "Starter from bristweb/cred@${GITHUB_SHA::7}"
          git push -q origin main
      - name: Confirm the starter equals template/
        run: |
          rm -rf "$RUNNER_TEMP/starter-check"
          sh template/package/tools/build-starter.sh "$RUNNER_TEMP/starter-check"
          diff -qr "$RUNNER_TEMP/starter-check" "$RUNNER_TEMP/starter"
