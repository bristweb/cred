# Syntax check, validate the bundled examples (template/data/), and a browserless static HTTP smoke test of the
# real paths, a GitHub Pages project subpath, the deploy export and the /v/ release copies (template/package/tools/smoke-test.mjs).
name: Check
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the /v/ release copies
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: for f in template/package/assets/js/cred.js site/*.js template/package/tools/*.mjs template/package/tools/test/*.mjs; do node --check "$f"; done
      - run: sh -n template/package/tools/export-site.sh
      - name: Widget declares a release version
        run: node template/package/tools/widget-version.mjs
      - name: No build output or old layout
        run: '! test -e dist && ! test -e src && ! test -e content && ! test -e template/data/site && ! test -e data/site'
      - run: node template/package/tools/validate.mjs template/data && node template/package/tools/badge.mjs template/data && git diff --exit-code template/data/badge.json
      - run: npm test
