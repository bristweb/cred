# Syntax check, validate the bundled examples (package/example-data/), and a browserless static HTTP smoke test of the
# real paths, a GitHub Pages project subpath, the deploy export and the /v/ release copies (package/tools/smoke-test.mjs).
name: Check
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the /v/ release copies
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: for f in package/assets/js/cred.js package/tools/*.mjs package/tools/test/*.mjs; do node --check "$f"; done
      - run: sh -n package/tools/export-site.sh
      - name: VERSION matches package.json
        run: grep -q "const VERSION = '$(node -p "require('./package.json').version")'" package/assets/js/cred.js
      - name: No build output or old layout
        run: '! test -e dist && ! test -e src && ! test -e content && ! test -e package/example-data/site && ! test -e data/site'
      - run: node package/tools/validate.mjs package/example-data && node package/tools/badge.mjs package/example-data && git diff --exit-code package/example-data/badge.json
      - run: npm test
