# Syntax check + validate the bundled fictional example/.
name: Check
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: node --check assets/js/cred.js && node --check scripts/validate.mjs && node --check scripts/badge.mjs && node --check scripts/build-versions.mjs
      - name: VERSION matches package.json
        run: grep -q "const VERSION = '$(node -p "require('./package.json').version")'" assets/js/cred.js
      - run: node scripts/validate.mjs example && node scripts/badge.mjs example && git diff --exit-code example/badge.json
